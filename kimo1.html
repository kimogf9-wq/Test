<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كرسي — DESIGN Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d0a;
            --panel: rgba(16, 20, 15, 0.92);
            --accent: #12a37e;
            --accent-dim: rgba(18, 163, 126, 0.16);
            --border: rgba(230, 238, 230, 0.12);
            --text: #eef2ee;
            --muted: #8b968a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        h1,h2,h3,.brand,.opt-btn,.tab-btn,.price,.val,.label{ font-family: 'Cairo', sans-serif; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 56px;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .brand-wrap { display:flex; align-items:center; gap:12px; }
        .back-link { color: var(--muted); text-decoration:none; font-size:13px; display:flex; align-items:center; gap:6px; }
        .back-link svg{ width:14px; height:14px; }
        .brand { font-size: 15px; font-weight: 700; color: var(--text); letter-spacing:.02em; }
        .code-tag { font-size:11px; color: var(--accent); font-weight:700; letter-spacing:.05em; display:block; margin-top:1px; }
        .price { background: var(--accent-dim); padding: 4px 12px; border-radius: 16px; color: var(--accent); font-weight: 700; border: 1px solid rgba(18, 163, 126, 0.35); }

        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            pointer-events: none; 
        }

        .controls-area {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 8px;
            display: none;
            width: 92%;
            max-width: 500px;
            backdrop-filter: blur(12px);
        }

        .panel.active { display: block; }

        .row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .row::-webkit-scrollbar { display: none; }

        .opt-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .opt-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #06120d;
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

        .slider-group { display:flex; flex-direction:column; gap:16px; }
        .slider-item { display:flex; align-items:center; gap:12px; }
        .slider-item .label { font-size:13px; color: var(--muted); min-width:90px; font-weight:600; }
        .slider-item .val { font-size:13px; color: var(--accent); font-weight:700; min-width:56px; text-align:left; }
        input[type="range"]{ flex:1; height:4px; border-radius:2px; background:var(--border); outline:none; accent-color: var(--accent); -webkit-appearance:none; }
        input[type="range"]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); cursor:pointer; box-shadow:0 0 0 3px rgba(18,163,126,.2); }

        .nav-tabs {
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border);
            width: 100%;
            display: flex;
            padding: 6px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #64748b;
            padding: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .tab-btn.active { color: var(--accent); background: rgba(255, 255, 255, 0.06); border-radius: 8px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="brand-wrap">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
                الكتالوج
            </a>
            <div>
                <div class="brand">كرسي</div>
                <span class="code-tag">CH—01</span>
            </div>
        </div>
        <div class="price" id="price-tag">$230</div>
    </div>

    <div id="canvas-container"></div>

    <div class="controls-area">
        <div class="panel active" id="p-size">
            <div class="slider-group">
                <div class="slider-item">
                    <span class="label">العرض</span>
                    <input type="range" id="inp-width" min="65" max="220" step="5" value="90" oninput="updateDimensions()">
                    <span class="val" id="txt-width">90 سم</span>
                </div>
                <div class="slider-item">
                    <span class="label">الارتفاع</span>
                    <input type="range" id="inp-height" min="75" max="115" step="1" value="90" oninput="updateDimensions()">
                    <span class="val" id="txt-height">90 سم</span>
                </div>
            </div>
        </div>

        <div class="panel" id="p-type">
            <div class="row">
                <button class="opt-btn active" onclick="setSeats(1, this)">كرسي مفرد</button>
                <button class="opt-btn" onclick="setSeats(2, this)">كنبة لشخصين</button>
                <button class="opt-btn" onclick="setSeats(3, this)">كنبة ثلاثية</button>
            </div>
        </div>

        <!-- تبويب أنواع وخامات القماش -->
        <div class="panel" id="p-fabric">
            <div class="row">
                <button class="opt-btn active" onclick="setFabricType('velvet', 0x2dd4bf, this)">مخمل (Velvet)</button>
                <button class="opt-btn" onclick="setFabricType('leather', 0x3d2314, this)">جلد فاخر (Leather)</button>
                <button class="opt-btn" onclick="setFabricType('linen', 0xd1c7bd, this)">كتان (Linen)</button>
                <button class="opt-btn" onclick="setFabricType('wool', 0x475569, this)">صوف دافئ (Wool)</button>
            </div>
            <div class="row" style="margin-top: 8px;">
                <button class="opt-btn" onclick="setFabricColor(0x2dd4bf, this)"><span class="dot" style="background:#2dd4bf"></span> تركواز</button>
                <button class="opt-btn" onclick="setFabricColor(0x8b5cf6, this)"><span class="dot" style="background:#8b5cf6"></span> بنفسجي</button>
                <button class="opt-btn" onclick="setFabricColor(0x334155, this)"><span class="dot" style="background:#334155"></span> كحلي</button>
                <button class="opt-btn" onclick="setFabricColor(0xd97706, this)"><span class="dot" style="background:#d97706"></span> خردلي</button>
            </div>
        </div>

        <div class="panel" id="p-legs">
            <div class="row">
                <button class="opt-btn active" onclick="setLegs(0xb45309, 0.6, 0, this)">خشب طبيعي</button>
                <button class="opt-btn" onclick="setLegs(0x1e293b, 0.7, 0, this)">أسود مودرن</button>
                <button class="opt-btn" onclick="setLegs(0xf59e0b, 0.2, 0.9, this)">معدن ذهبي</button>
            </div>
        </div>

        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchPanel('p-size', this)">المقاس</button>
            <button class="tab-btn" onclick="switchPanel('p-type', this)">التصميم والعدد</button>
            <button class="tab-btn" onclick="switchPanel('p-fabric', this)">نوع خامة القماش</button>
            <button class="tab-btn" onclick="switchPanel('p-legs', this)">خامة الأرجل</button>
        </div>
    </div>

<script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0f19);

    const camera = new THREE.PerspectiveCamera(38, container.clientWidth / container.clientHeight, 0.1, 100);
    camera.position.set(1.8, 1.2, 2.2);
    camera.lookAt(0, 0.3, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // --- الإضاءة ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
    mainLight.position.set(3, 4, 3);
    mainLight.castShadow = true;
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
    fillLight.position.set(-3, 2, -2);
    scene.add(fillLight);

    // --- الخامات المجهزة برمجياً (Procedural Textures) ---
    const fabricMat = new THREE.MeshStandardMaterial({ color: 0x2dd4bf, roughness: 0.75 });
    const buttonMat = new THREE.MeshStandardMaterial({ color: 0x1d9a8b, roughness: 0.5 });
    const legMat = new THREE.MeshStandardMaterial({ color: 0xb45309, roughness: 0.5 });

    let mainGroup = new THREE.Group();
    scene.add(mainGroup);

    let currentSeats = 1;
    let dims = { width: 90, height: 90 };

    // تغيير خصائص الخامات الفيزيائية لتجسيد نوع القماش (Roughness / Metalness / Roughness Maps)
    function setFabricType(type, defaultColor, btn) {
        setActive(btn);
        
        if (type === 'velvet') {
            // المخمل: نعومة عالية مع لمعة خفيفة
            fabricMat.roughness = 0.85;
            fabricMat.metalness = 0.1;
        } else if (type === 'leather') {
            // الجلد: صقالة ومعان قوي (Smooth & Glossy)
            fabricMat.roughness = 0.25;
            fabricMat.metalness = 0.2;
        } else if (type === 'linen') {
            // الكتان: خشن ومطفي تماماً (Matte & Rough)
            fabricMat.roughness = 0.95;
            fabricMat.metalness = 0.0;
        } else if (type === 'wool') {
            // الصوف: ملمس متوسط مع خشونة قماشية
            fabricMat.roughness = 0.75;
            fabricMat.metalness = 0.0;
        }

        setFabricColor(defaultColor);
    }

    function setFabricColor(hex, btn) {
        if(btn) setActive(btn);
        fabricMat.color.setHex(hex);
        const c = new THREE.Color(hex);
        c.multiplyScalar(0.75);
        buttonMat.color.copy(c);
    }

    function createRoundedBox(w, h, d, radius) {
        const shape = new THREE.Shape();
        const eps = 0.00001;
        const width = w - radius * 2;
        const height = h - radius * 2;

        shape.absarc(eps, eps, radius, -Math.PI / 2, -Math.PI, true);
        shape.absarc(eps, height, radius, Math.PI, Math.PI / 2, true);
        shape.absarc(width, height, radius, Math.PI / 2, 0, true);
        shape.absarc(width, eps, radius, 0, -Math.PI / 2, true);

        const extrudeSettings = {
            depth: d - radius * 2,
            bevelEnabled: true,
            bevelSegments: 3,
            steps: 1,
            bevelSize: radius,
            bevelThickness: radius
        };

        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
        geometry.center();
        return geometry;
    }

    function createTuftingButtons(parentGroup, width, height, rows, cols, zPos) {
        const buttonGeo = new THREE.SphereGeometry(0.016, 12, 12);
        buttonGeo.scale(1, 1, 0.5);

        const startX = -width / 2 + 0.12;
        const stepX = (width - 0.24) / (cols - 1 || 1);
        const startY = 0.28;
        const stepY = (height - 0.15) / (rows - 1 || 1);

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const btnMesh = new THREE.Mesh(buttonGeo, buttonMat);
                const offsetX = (r % 2 === 1) ? stepX / 2 : 0;
                btnMesh.position.set(startX + c * stepX + offsetX, startY + r * stepY, zPos);
                parentGroup.add(btnMesh);
            }
        }
    }

    function buildChair() {
        while (mainGroup.children.length > 0) {
            mainGroup.remove(mainGroup.children[0]);
        }

        const width = dims.width / 100;
        const hs = dims.height / 90; // heightScale relative to 90cm baseline
        const depth = 0.8;
        const armThick = 0.14;

        const seatGeo = createRoundedBox(width - (armThick * 1.8), 0.16, depth - armThick * 1.2, 0.03);
        const seatMesh = new THREE.Mesh(seatGeo, fabricMat);
        seatMesh.position.set(0, 0.22 * hs, 0.02);
        mainGroup.add(seatMesh);

        const backGeo = createRoundedBox(width, 0.48 * hs, armThick, 0.03);
        const backMesh = new THREE.Mesh(backGeo, fabricMat);
        backMesh.position.set(0, 0.42 * hs, -depth / 2 + armThick / 2);
        mainGroup.add(backMesh);

        const cols = currentSeats === 1 ? 4 : currentSeats === 2 ? 7 : 10;
        createTuftingButtons(mainGroup, width, 0.45 * hs, 3, cols, -depth / 2 + armThick + 0.005);

        const armGeo = createRoundedBox(armThick, 0.38 * hs, depth - armThick, 0.03);
        const leftArm = new THREE.Mesh(armGeo, fabricMat);
        leftArm.position.set(-width / 2 + armThick / 2, 0.37 * hs, armThick / 2);
        mainGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, fabricMat);
        rightArm.position.set(width / 2 - armThick / 2, 0.37 * hs, armThick / 2);
        mainGroup.add(rightArm);

        const legGeo = new THREE.CylinderGeometry(0.022, 0.015, 0.18 * hs, 16);
        const legX = width / 2 - 0.09;
        const legZ = depth / 2 - 0.09;

        [[ -legX, 0.09 * hs, legZ, 0.12, -0.12 ], [ legX, 0.09 * hs, legZ, 0.12, 0.12 ],
         [ -legX, 0.09 * hs, -legZ, -0.12, -0.12 ], [ legX, 0.09 * hs, -legZ, -0.12, 0.12 ]].forEach(p => {
            const leg = new THREE.Mesh(legGeo, legMat);
            leg.position.set(p[0], p[1], p[2]);
            leg.rotation.x = p[3];
            leg.rotation.z = p[4];
            mainGroup.add(leg);
        });
    }

    function updateDimensions() {
        dims.width = parseInt(document.getElementById('inp-width').value);
        dims.height = parseInt(document.getElementById('inp-height').value);
        document.getElementById('txt-width').textContent = dims.width + ' سم';
        document.getElementById('txt-height').textContent = dims.height + ' سم';
        updatePrice();
        buildChair();
    }

    function updatePrice() {
        const base = currentSeats * 120 + 110;
        const sizeAdj = Math.round((dims.width - 90) * 0.6 + (dims.height - 90) * 0.8);
        document.getElementById('price-tag').textContent = '$' + (base + sizeAdj);
    }

    function setSeats(count, btn) {
        currentSeats = count;
        setActive(btn);
        const defaultWidth = count === 1 ? 90 : count === 2 ? 150 : 210;
        dims.width = defaultWidth;
        document.getElementById('inp-width').value = defaultWidth;
        document.getElementById('txt-width').textContent = defaultWidth + ' سم';
        buildChair();
        updatePrice();
    }

    function setLegs(hex, roughness, metalness, btn) {
        legMat.color.setHex(hex);
        legMat.roughness = roughness;
        legMat.metalness = metalness;
        setActive(btn);
    }

    function setActive(btn) {
        btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function switchPanel(id, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    buildChair();
    animate();
</script>
</body>
</html>
